name: Test Workflow

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test workflow trigger
        run: |
          echo "Workflow triggered successfully!"
          echo "Tag: ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"