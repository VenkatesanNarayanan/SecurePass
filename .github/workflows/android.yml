name: Android

# Builds a release APK for 64-bit ARM (arm64-v8a, effectively every phone in
# use). A universal APK with all four ABIs is ~57 MB, over Cloudflare Pages'
# 25 MiB file limit for the website; the arm64 one is ~17 MB.
#
# Runs from release.yml on every version tag, or by hand from the Actions tab
# ("Run workflow") to check the Android build without making a release.
#
# Signing needs these repository secrets (see docs/ANDROID_RELEASE.md):
#   ANDROID_KEYSTORE_BASE64    the release keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  the keystore password
#   ANDROID_KEY_ALIAS          the key alias inside the keystore
#   ANDROID_KEY_PASSWORD       the key password
# Without them the job still builds, but only uploads an unsigned APK for
# inspection; nothing is published to the website.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  NDK_VERSION: "27.2.12479018"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-aarch64

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release APK (arm64)
        run: npm run tauri android build -- --target aarch64 --apk true

      - name: Sign APK
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VER=$(node -p "require('./package.json').version")
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          if [ -z "$UNSIGNED" ]; then
            echo "::error::No unsigned release APK found under src-tauri/gen/android."
            exit 1
          fi
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)
          mkdir -p _android

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: uploading an unsigned APK only; nothing will be published."
            cp "$UNSIGNED" "_android/SecurePass_${VER}_android_arm64-unsigned.apk"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYSTORE="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$KEYSTORE"' EXIT
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"

          OUT="_android/SecurePass_${VER}_android_arm64.apk"
          "${BUILD_TOOLS}zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          # Passwords are read from the environment, never put on the command line.
          "${BUILD_TOOLS}apksigner" sign \
            --ks "$KEYSTORE" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --v4-signing-enabled false \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "${BUILD_TOOLS}apksigner" verify --print-certs "$OUT"

          # The website (Cloudflare Pages) rejects files over 25 MiB.
          SIZE=$(stat -c %s "$OUT")
          echo "APK size: $((SIZE / 1024 / 1024)) MiB"
          if [ "$SIZE" -gt $((25 * 1024 * 1024)) ]; then
            echo "::error::Signed APK is over Cloudflare Pages' 25 MiB file limit."
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Picked up by release.yml's publish-web job (pattern release-artifacts-*).
      - name: Upload signed APK
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-android
          path: _android/
          retention-days: 7

      # Named outside that pattern, so it is never published.
      - name: Upload unsigned APK
        if: steps.sign.outputs.signed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-unsigned
          path: _android/
          retention-days: 7
