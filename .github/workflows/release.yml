name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Node (Frontend)
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Install Rust (Backend)
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Linux dependencies
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # Install frontend deps
      - name: Install frontend dependencies
        run: npm install

      # Build & Publish Release
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SKIP_CODESIGNING: "true"
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SecurePass ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          includeBundledTauri: true

      # macOS: wrap the .app in a .pkg with a post-install script that removes
      # the quarantine flag automatically, so users never need to run xattr manually.
      # They still need to right-click → Open the .pkg once (standard unsigned-app UX).
      - name: Create macOS PKG installer
        if: matrix.platform == 'macos-latest'
        run: |
          APP_PATH=$(find src-tauri/target/release/bundle/macos -name "*.app" -maxdepth 1 | head -1)
          VERSION=$(node -p "require('./package.json').version")

          mkdir -p _pkg_staging/Applications _pkg_scripts

          cp -r "$APP_PATH" _pkg_staging/Applications/

          printf '#!/bin/bash\nxattr -dr com.apple.quarantine "/Applications/SecurePass.app" 2>/dev/null || true\n' \
            > _pkg_scripts/postinstall
          chmod +x _pkg_scripts/postinstall

          pkgbuild \
            --root _pkg_staging \
            --scripts _pkg_scripts \
            --identifier com.securepass.app \
            --version "$VERSION" \
            "SecurePass_${VERSION}_macos.pkg"

      - name: Upload PKG to GitHub release
        if: matrix.platform == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "${{ github.ref_name }}" "SecurePass_${VERSION}_macos.pkg" --clobber

  # ── Update securepass-web with latest download links ──────────────────────
  publish-web:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout securepass-web
        uses: actions/checkout@v4
        with:
          repository: VenkatesanNarayanan/securepass-web
          token: ${{ secrets.WEB_REPO_PAT }}

      - name: Write release-data.js
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          BASE="https://github.com/VenkatesanNarayanan/SecurePass/releases/download/${TAG}"
          cat > release-data.js <<EOF
          window.SECUREPASS_RELEASE = {
            "version": "${VER}",
            "tag": "${TAG}",
            "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "macos": {
                "label": "macOS (PKG — Recommended)",
                "url": "${BASE}/SecurePass_${VER}_macos.pkg",
                "note": "Right-click → Open on first launch"
              },
              "macos_dmg": {
                "label": "macOS (DMG — Apple Silicon)",
                "url": "${BASE}/SecurePass_${VER}_aarch64.dmg"
              },
              "windows_msi": {
                "label": "Windows (MSI Installer)",
                "url": "${BASE}/SecurePass_${VER}_x64_en-US.msi"
              },
              "windows_exe": {
                "label": "Windows (EXE Setup)",
                "url": "${BASE}/SecurePass_${VER}_x64-setup.exe"
              },
              "linux_appimage": {
                "label": "Linux (AppImage)",
                "url": "${BASE}/securepass_${VER}_amd64.AppImage"
              },
              "linux_deb": {
                "label": "Linux (DEB — Ubuntu / Debian)",
                "url": "${BASE}/securepass_${VER}_amd64.deb"
              }
            }
          };
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release-data.js
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "chore: update download links for ${{ github.ref_name }}"
          git push
