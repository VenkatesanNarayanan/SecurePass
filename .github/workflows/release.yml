name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # macOS builds (Intel)
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle-targets: 'app,dmg'
          # macOS builds (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle-targets: 'app,dmg'
          # Windows builds
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle-targets: 'msi,nsis'
          # Linux builds
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundle-targets: 'appimage,deb'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SecurePass ${{ github.ref_name }}'
          releaseBody: |
            ## SecurePass ${{ github.ref_name }}

            A secure, cross-platform password manager built with Rust and Svelte.

            ### Installation
            Download the appropriate installer for your platform from the assets below:

            - **macOS**: Download the `.dmg` file and run the installer
            - **Windows**: Download the `.msi` or `.exe` file and run the installer
            - **Linux**: Download the `.AppImage` for portable use or `.deb` for system installation

            ### Features
            - Military-grade encryption (ChaCha20-Poly1305 + Argon2)
            - Secure password generation with customizable options
            - Auto-lock timer and clipboard security
            - Export/import encrypted vault backups
            - Cross-platform support
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle-targets }}