name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SKIP_CODESIGNING: "true"
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SecurePass ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          includeBundledTauri: true

      - name: Create macOS PKG installer
        if: matrix.platform == 'macos-latest'
        run: |
          APP_PATH=$(find src-tauri/target/release/bundle/macos -name "*.app" -maxdepth 1 | head -1)
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p _pkg_staging/Applications _pkg_scripts
          cp -r "$APP_PATH" _pkg_staging/Applications/
          printf '#!/bin/bash\nxattr -dr com.apple.quarantine "/Applications/SecurePass.app" 2>/dev/null || true\n' \
            > _pkg_scripts/postinstall
          chmod +x _pkg_scripts/postinstall
          pkgbuild \
            --root _pkg_staging \
            --scripts _pkg_scripts \
            --identifier com.securepass.app \
            --version "$VERSION" \
            "SecurePass_${VERSION}_macos.pkg"

      # Collect built files into a staging folder before upload
      - name: Collect macOS artifacts
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          mkdir -p _release_artifacts
          cp "SecurePass_${VER}_macos.pkg" _release_artifacts/
          cp src-tauri/target/release/bundle/dmg/*.dmg _release_artifacts/ 2>/dev/null || true

      - name: Collect Windows artifacts
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p _release_artifacts
          cp src-tauri/target/release/bundle/msi/*.msi       _release_artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/nsis/*-setup.exe _release_artifacts/ 2>/dev/null || true

      - name: Collect Linux artifacts
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p _release_artifacts
          # AppImage excluded: Cloudflare Pages has a 25 MiB file limit; AppImage is ~78 MiB.
          # To re-enable: uncomment the line below and host via a separate CDN/R2 bucket.
          # cp src-tauri/target/release/bundle/appimage/*.AppImage _release_artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/deb/*.deb _release_artifacts/ 2>/dev/null || true

      - name: Upload artifacts for publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.platform }}
          path: _release_artifacts/
          retention-days: 1

  # ── Push release binaries to securepass-web and update download links ──────
  publish-web:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout securepass-web
        uses: actions/checkout@v4
        with:
          repository: VenkatesanNarayanan/securepass-web
          token: ${{ secrets.WEB_REPO_PAT }}

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-artifacts-*
          path: _all_artifacts
          merge-multiple: true

      - name: Copy artifacts into releases directory
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p "releases/${TAG}"
          cp _all_artifacts/* "releases/${TAG}/"
          echo "Files in releases/${TAG}:"
          ls -lh "releases/${TAG}/"

      - name: Write release-data.js and version.json
        run: |
          TAG="${{ github.ref_name }}"
          BASE="releases/${TAG}"
          # Detect the real file version from the PKG filename (comes from package.json,
          # not the git tag — e.g. tag v1.1.13 but files named SecurePass_1.0.0_*.*)
          PKG=$(ls releases/${TAG}/*.pkg 2>/dev/null | head -1)
          FILE_VER=$(basename "$PKG" | sed 's/SecurePass_//; s/_macos\.pkg//')
          VER="${FILE_VER}"
          RELEASED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > release-data.js <<EOF
          window.SECUREPASS_RELEASE = {
            "version": "${VER}",
            "tag": "${TAG}",
            "released_at": "${RELEASED_AT}",
            "platforms": {
              "macos": {
                "label": "macOS (PKG — Recommended)",
                "url": "${BASE}/SecurePass_${VER}_macos.pkg",
                "note": "Right-click → Open on first launch"
              },
              "macos_dmg": {
                "label": "macOS (DMG — Apple Silicon)",
                "url": "${BASE}/SecurePass_${VER}_aarch64.dmg"
              },
              "windows_msi": {
                "label": "Windows (MSI Installer)",
                "url": "${BASE}/SecurePass_${VER}_x64_en-US.msi",
                "note": "SmartScreen may warn — click 'More info' → 'Run anyway'"
              },
              "windows_exe": {
                "label": "Windows (EXE Setup)",
                "url": "${BASE}/SecurePass_${VER}_x64-setup.exe",
                "note": "SmartScreen may warn — click 'More info' → 'Run anyway'"
              },
              "linux_deb": {
                "label": "Linux (DEB — Ubuntu / Debian)",
                "url": "${BASE}/SecurePass_${VER}_amd64.deb"
              }
            }
          };
          EOF
          # version.json — fetched by the app on startup for update checks
          cat > version.json <<EOF
          {
            "version": "${VER}",
            "tag": "${TAG}",
            "released_at": "${RELEASED_AT}",
            "download_url": "https://www.securepass.wonderstek.com/#download"
          }
          EOF

      - name: Prune old releases (keep 2 most recent)
        run: |
          # Sort release dirs by version descending, remove anything beyond the 2 newest.
          if [ -d releases ]; then
            mapfile -t OLD < <(ls -d releases/v* 2>/dev/null | sort -V -r | tail -n +3)
            for dir in "${OLD[@]}"; do
              echo "Removing old release: $dir"
              git rm -rf "$dir"
            done
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "releases/${{ github.ref_name }}" release-data.js version.json
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "release: add binaries for ${{ github.ref_name }}, prune old releases"
          git push
