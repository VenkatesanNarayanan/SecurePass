name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # macOS builds (Intel)
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle-targets: 'app,dmg'
          # macOS builds (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle-targets: 'app,dmg'
          # Windows builds
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle-targets: 'msi,nsis'
          # Linux builds
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundle-targets: 'appimage,deb'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle-targets }}

  update-release-notes:
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")

          # Generate changelog from commits since last tag
          if [ "$LATEST_TAG" != "v0.0.0" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              echo "## What's Changed" >> changelog.md
              echo "" >> changelog.md
              git log --pretty=format:"- %s" ${PREV_TAG}..HEAD >> changelog.md
              echo "" >> changelog.md
              echo "## Installation" >> changelog.md
              echo "- Download the appropriate installer for your platform from the assets below" >> changelog.md
              echo "- Run the installer and follow the setup instructions" >> changelog.md
            fi
          fi

      - name: Update release with changelog
        uses: softprops/action-gh-release@v1
        if: steps.changelog.outputs.body != ''
        with:
          tag_name: ${{ github.ref_name }}
          body_path: changelog.md
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}