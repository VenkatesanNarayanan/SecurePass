<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SecurePass app icon source ("D3": soft gradient shield with keyhole).
       Regenerate every platform size with:
       npx tauri icon src-tauri/icons/app-icon.svg
       then keep only the files already tracked in src-tauri/icons/ (it also
       creates android/ and ios/ folders this project doesn't use), and copy
       128x128.png to static/favicon.png and static/app-icon.png.
       Tile follows the macOS icon grid (824 px tile, 100 px margin). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#272B34"/>
      <stop offset="1" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A9BCFF"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="4"/>

  <path d="M512 222 L736 304 V500 C736 652 640 756 512 806 C384 756 288 652 288 500 V304 Z" fill="url(#shield)"/>
  <circle cx="512" cy="468" r="64" fill="#1A1D23"/>
  <rect x="484" y="490" width="56" height="164" rx="28" fill="#1A1D23"/>
</svg>
